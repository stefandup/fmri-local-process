[build-system]
requires = ["setuptools>=61", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-local-process"
dynamic = ["version", "dependencies"]
description = "Local fMRI preprocessing, QC and region timeseries viewer."
authors = [{ name = "Stefan du Plessis" }]

[project.optional-dependencies]
gui = ["PySide6"]  # the fmri_toolbox window
tui = ["textual", "textual-image"]  # the terminal app, for servers without a display

[tool.setuptools_scm]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
fmri_convert_to_bids = "fmri_local_process.cli.convert_to_bids:main"
fmri_behav_events = "fmri_local_process.cli.behav_events:main"
fmri_behav_check = "fmri_local_process.cli.behav_check:main"
fmri_toolbox = "fmri_local_process.gui.launcher:main"
fmri_crosscheck = "fmri_local_process.gui.launcher:crosscheck"
fmri_preprocess = "fmri_local_process.cli.preprocess:main"
fmri_preprocess_gui = "fmri_local_process.gui.launcher:preprocess"

[tool.setuptools.package-data]
"fmri_local_process.gui" = ["assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]  # never walk into the (real-data) C-PAC output folders
log_cli = true
log_cli_level = "INFO"
